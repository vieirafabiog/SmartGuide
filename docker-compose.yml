services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_guide}
      POSTGRES_USER: ${POSTGRES_USER:-smart_guide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_guide} -d ${POSTGRES_DB:-smart_guide}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sg-api:
    build:
      context: ./sg-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3001
      LOCAL_STORAGE_PATH: /app/uploads
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart_guide}:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_guide}
    ports:
      - "${API_PORT:-3000}:3001"
    volumes:
      - sg_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sg-web:
    build:
      context: .
      dockerfile: sg-web/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-/api}
        EXPO_PUBLIC_DEFAULT_LOCALE: ${EXPO_PUBLIC_DEFAULT_LOCALE:-pt-BR}
    restart: unless-stopped
    depends_on:
      sg-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
  sg_uploads:
  minio_data:
